# PRAMAN — Nginx Reverse Proxy Configuration
# Place at: /etc/nginx/sites-available/default  (or /etc/nginx/conf.d/praman.conf)
# Apply with: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name praman-ai.indiasouthcentral.cloudapp.azure.com _;

    # ── Timeouts for long-running OCR scans (up to 120s) ──────────────
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    send_timeout          300s;

    # ── Allow high-res multi-face image uploads ────────────────────────
    client_max_body_size  50M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade     $http_upgrade;
        proxy_set_header   Connection  "upgrade";
        proxy_set_header   Host        $host;
        proxy_set_header   X-Real-IP   $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # ── Static health endpoint shortcut ───────────────────────────────
    location /health {
        proxy_pass         http://127.0.0.1:8000/health;
        proxy_read_timeout 10s;
    }

    # ── Optional: HTTPS redirect (uncomment if SSL is configured) ─────
    # return 301 https://$host$request_uri;
}

